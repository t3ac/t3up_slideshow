<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xmlns:f="http://typo3.org/ns/fluid/ViewHelpers">

<div id="c{data.uid}" class="frame-{data.frame_class} 
							{f:if(condition: data.space_before_class, then: 'mt-{data.space_before_class}')} 
							{f:if(condition: data.space_after_class, then: 'mb-{data.space_after_class}')}" style="<f:if condition="{data.bgcolor}">background-color: {data.bgcolor};</f:if>">

    <f:if condition="{flexFormData.animationtype} == 'carousel'">
        <f:then>
		    <div id="slideshow{data.uid}" class="{f:if(condition: data.container, then: 'container')}  w-auto t3up_slider carousel slide {flexFormData.animation}" data-ride="carousel" data-bs-ride="carousel" data-interval="{flexFormData.slideshowSpeed}">
		
		        <!-- Indicators -->
		         <f:if condition="{flexFormData.controlNav}">
		             <ol class="carousel-indicators {flexFormData.indicat} ">
		                <f:for each="{image}" as="helper" iteration="iteration">
		                    <li type="button" 
		                    data-target="#slideshow{data.uid}" 
		                    data-bs-target="#slideshow{data.uid}"   
		                    data-slide-to="{iteration.index}"
		                    data-bs-slide-to="{iteration.index}"  
		                    class="{f:if(condition: '{iteration.isFirst}', then: 'active')}"   
		                    data-bs-touch="true">                   
		                    </li>            
		                </f:for>
		            </ol>     
		         </f:if>   
		
		        
		        <div class="carousel-inner">
		            <f:for each="{image}" as="image" iteration="iteration">
		                <div data-bs-interval="{flexFormData.slideshowSpeed}" class="carousel-item  imageformat{flexFormData.imageformat}  {f:if(condition: '{iteration.isFirst}', then: ' active')}" >
		                    <f:if condition="{image.link}">
		                        <f:then>
		                            <f:link.typolink parameter="{image.link}">
		                                <f:render partial="Rendering/Image" section="picture" arguments="{_all}"/>
		                            </f:link.typolink> 
		                        </f:then>
		                        <f:else>
		                             <f:render partial="Rendering/Image" section="picture" arguments="{_all}"/>      
		                        </f:else>                                  
		                   </f:if>     
		                  </div>
		            </f:for>
		        </div>
		        
		        <f:if condition="{flexFormData.directionNav}">
			        <!-- Direction -->
			        <button class="carousel-control-prev d-flex justify-content-center align-items-center" type="button" data-bs-target="#slideshow{data.uid}" data-bs-slide="prev">
			           <span class="symbol-outline prev {flexFormData.slidefontsize}" style="background-color:{flexFormData.backgroundcolor}; color: {flexFormData.captioncolor}; ">&#xe2ea</span>
			           <span class="visually-hidden">Previous</span>
			        </button>
			        <button class="carousel-control-next d-flex justify-content-center align-items-center" type="button" data-bs-target="#slideshow{data.uid}" data-bs-slide="next">
			          <span class="symbol-outline next {flexFormData.slidefontsize}" style="background-color: {flexFormData.backgroundcolor}; color: {flexFormData.captioncolor};">&#xe5e1</span>
			          <span class="visually-hidden">Next</span>
			        </button>
		        </f:if>
		    </div>
		 </f:then>  
 
		<f:else>	
	        <div class="inarow d-flex align-items-stretch" style="--n: {flexFormData.inarow}; --s: {flexFormData.inarowwidth}% ;  --d: {flexFormData.duration}s ">
	              <f:for each="{image}" as="image" iteration="iteration">
	                  <div class="bannerelement d-flex align-items-center""> 
		                  <f:if condition="{image.link}">
		                      <f:then>
		                          <f:link.typolink parameter="{image.link}">
		                               <f:render partial="Rendering/Image" section="picture" arguments="{_all}"/>
		                          </f:link.typolink>
		                      </f:then>
		                      <f:else>
		                         <f:render partial="Rendering/Image" section="picture" arguments="{_all}"/>
		                      </f:else>
		                   </f:if>
		              </div>     
	             </f:for>
	         </div>             
		</f:else>
	</f:if>		
	
</div>


<f:section name="debug">
    {_all -> f:debug(inline:1)}
</f:section>

</html>
